<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090814"/>
      <stop offset="50%" stop-color="#140f2b"/>
      <stop offset="100%" stop-color="#06050e"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="4"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#glowGrad)" stroke-width="12" filter="url(#glow)" opacity="0.65"/>
  
  <!-- Center Stylized G -->
  <path d="M 330 200 C 310 160 250 150 210 170 C 160 195 150 270 180 320 C 210 360 280 365 320 330 C 335 315 340 295 340 270 L 260 270 L 260 240 L 370 240 C 372 280 360 335 325 365 C 270 410 180 400 135 345 C 90 280 100 185 165 135 C 230 85 325 100 375 155 Z" fill="url(#glowGrad)" filter="url(#glow)"/>
  
  <!-- Sparkles -->
  <path d="M 380 120 Q 380 145 405 145 Q 380 145 380 170 Q 380 145 355 145 Q 380 145 380 120 Z" fill="#ec4899"/>
  <path d="M 130 380 Q 130 395 145 395 Q 130 395 130 410 Q 130 395 115 395 Q 130 395 130 380 Z" fill="#38bdf8"/>
</svg>
